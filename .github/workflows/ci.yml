name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        # next typegen writes the route types (PageProps, RouteContext) that tsc needs.
        run: npx next typegen && npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Translations in sync
        run: npm run i18n:check
      - name: Build the worker
        # The deployed worker and migrations run from this bundle (scripts/build-worker.mjs).
        run: npm run build:worker
      - name: Build
        run: npm run build
        env:
          # Placeholders so the build doesn't need real services; nothing connects at build time.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret
          BETTER_AUTH_URL: http://localhost:3000
          SMTP_URL: smtp://localhost:1025
          EMAIL_FROM: ci@example.com

  image:
    # The deployed image, run the way Render runs it, so a file the image leaves out
    # or a bundle that won't start fails here rather than on staging. The worker's
    # commands are read from render.yaml. Postgres starts empty; storage is a fake S3.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      s3:
        image: adobe/s3mock:3.12.0
        ports: ["9090:9090"]
    env:
      WORKER: .projects[0].environments[] | select(.name == "production") | .services[] | select(.name == "taloox-worker")
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: taloox:ci
          build-args: RENDER_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Settings
        # Placeholders, as for the build: nothing here reaches a real service.
        run: |
          cat > "$RUNNER_TEMP/env" <<'EOF'
          APP_ENV=testing
          DATABASE_URL=postgres://postgres:ci@localhost:5432/postgres
          BETTER_AUTH_SECRET=ci-placeholder-secret
          BETTER_AUTH_URL=http://localhost:3000
          SMTP_URL=smtp://localhost:1025
          EMAIL_FROM=ci@example.com
          WORKER_SECRET=ci-worker-secret
          STORAGE_S3_ENDPOINT=http://localhost:9090
          STORAGE_S3_ACCESS_KEY_ID=ci
          STORAGE_S3_SECRET_ACCESS_KEY=ci
          EOF
      - name: Pre-deploy on an empty database
        # Migrations, then the contract and quote templates, generated and uploaded.
        run: docker run --rm --network host --env-file "$RUNNER_TEMP/env" taloox:ci sh -c "$(yq "$WORKER | .preDeployCommand" render.yaml)"
      - name: The worker starts, and stops cleanly on SIGTERM
        run: |
          docker run -d --name worker --network host --env-file "$RUNNER_TEMP/env" taloox:ci sh -c "exec $(yq "$WORKER | .dockerCommand" render.yaml)"
          ready() { docker logs worker 2>&1 | grep -q '"event":"worker.http.listening"'; }
          for _ in $(seq 30); do ready && break; sleep 1; done
          ready || { docker logs worker; exit 1; }
          docker stop -t 30 worker
          docker logs worker
          test "$(docker inspect -f '{{.State.ExitCode}}' worker)" = 0
      - name: The web service answers its health check
        run: |
          docker run -d --name web --network host --env-file "$RUNNER_TEMP/env" -e RENDER_GIT_COMMIT=${{ github.sha }} taloox:ci
          for _ in $(seq 60); do
            curl -sf localhost:3000/api/health | grep -q '"commit":"${{ github.sha }}"' && exit 0
            sleep 1
          done
          docker logs web
          exit 1

  staging:
    # Every commit on main that passes goes to staging. Off until the Render
    # services exist: set the repository variable RENDER_DEPLOYS to "on"
    # (docs/setup/render.md, "Deploys").
    needs: [checks, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOYS == 'on'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
