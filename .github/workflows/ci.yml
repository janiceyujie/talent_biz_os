name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        # next typegen writes the route types (PageProps, RouteContext) that tsc needs.
        run: npx next typegen && npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Translations in sync
        run: npm run i18n:check
      - name: Build the worker
        # The deployed worker and migrations run from this bundle (scripts/build-worker.mjs).
        run: npm run build:worker
      - name: Build
        run: npm run build
        env:
          # Placeholders so the build doesn't need real services; nothing connects at build time.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret
          BETTER_AUTH_URL: http://localhost:3000
          SMTP_URL: smtp://localhost:1025
          EMAIL_FROM: ci@example.com

  staging:
    # Every commit on main that passes goes to staging. Off until the Render
    # services exist: set the repository variable RENDER_DEPLOYS to "on"
    # (docs/setup/render.md, "Deploys").
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOYS == 'on'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit
