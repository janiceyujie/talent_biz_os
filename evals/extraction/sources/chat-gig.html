<!doctype html>
<!-- Made-up LINE-style chat used to render chat-gig-1.png / chat-gig-2.png (scripts in the scratchpad; see evals/README.md). -->
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#8cabd9;width:390px}
header{background:#273246;color:#fff;padding:14px 16px;font-weight:600;font-size:17px}
.day{text-align:center;margin:12px 0}.day span{background:rgba(0,0,0,.25);color:#fff;border-radius:10px;padding:3px 10px;font-size:12px}
.row{display:flex;gap:6px;padding:4px 10px;align-items:flex-end}.row.me{justify-content:flex-end}
.avatar{width:34px;height:34px;border-radius:50%;background:#f5b971;flex:none;display:grid;place-items:center;font-size:13px}
.bubble{max-width:250px;padding:8px 11px;border-radius:16px;font-size:15px;line-height:1.4;background:#fff}
.me .bubble{background:#8de055}.name{font-size:11px;color:#223;margin:0 0 2px 4px}.time{font-size:10px;color:#223}
</style></head><body>
<header>阿哲｜Riverside Live House</header>
<div class="day"><span>10月1日（四）</span></div>
<div class="row"><div class="avatar">哲</div><div><div class="name">阿哲｜Riverside Live House</div><div class="bubble">嗨～我是 Riverside Live House 的阿哲，想邀你們 10/24（六）晚上來我們這邊演出！</div></div><span class="time">下午 2:10</span></div>
<div class="row"><div class="avatar">哲</div><div><div class="bubble">大概 40 分鐘的 set，當天晚上 8 點上台</div></div><span class="time">下午 2:11</span></div>
<div class="row me"><span class="time">下午 2:15</span><div class="bubble">好喔！請問演出費大概多少呢？</div></div>
<div class="row"><div class="avatar">哲</div><div><div class="bubble">我們可以給 NT$18,000，含稅，演出完一週內匯款</div></div><span class="time">下午 2:18</span></div>
<div class="row"><div class="avatar">哲</div><div><div class="bubble">場地有鼓組跟基本音響，下午 5 點可以進場</div></div><span class="time">下午 2:18</span></div>
<div class="row me"><span class="time">下午 2:20</span><div class="bubble">了解，我跟團員確認一下</div></div>
<div class="row"><div class="avatar">哲</div><div><div class="bubble">沒問題～麻煩下週五前回覆我，謝謝 🙏</div></div><span class="time">下午 2:21</span></div>
</body></html>
